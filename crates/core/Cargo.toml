[package]
name = "openwebide-core"
description = "Shared domain types for Open WebIDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
base64 = { workspace = true }
ec4rs = { version = "1.2", features = ["allow-empty-values"] }
html5ever = "0.40"
ignore = "0.4.33"
regex = "1.13.1"
regex-automata = { version = "0.4.18", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"
unicode-bidi = "0.3.18"
unicode-width = "0.2.2"
serde = { workspace = true }
serde_json = { workspace = true }

tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }

tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }

[features]
test-support = []
editor-parser = [
    "dep:tree-sitter", "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-php",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
]

[dev-dependencies]
futures = { workspace = true }
proptest = "1.11"


[lints]
workspace = true
