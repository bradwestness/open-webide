[alias]
build-backend = "build -p openwebide-backend --target wasm32-wasip2 --release"
build-frontend = "build -p openwebide-frontend --target wasm32-unknown-unknown --release"
test-native = "test -p openwebide-core -p openwebide-llm -p openwebide-storage"

# The File System Access API (local workspace mode) is gated behind web-sys's
# unstable-apis cfg.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "web_sys_unstable_apis"]
