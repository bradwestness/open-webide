[workspace]
resolver = "2"
members = [
    "backend",
    "bridge",
    "crates/agent",
    "crates/auth",
    "crates/core",
    "crates/llm",
    "crates/storage",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Brad Westness"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
bytes = "1"
futures = "0.3"
gloo-net = { version = "0.7", features = ["websocket", "http"] }
hmac = "0.13"
http-body = "1"
http-body-util = "0.1.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
openwebide-agent = { path = "crates/agent" }
openwebide-auth = { path = "crates/auth" }
openwebide-core = { path = "crates/core" }
openwebide-llm = { path = "crates/llm" }
openwebide-storage = { path = "crates/storage" }
pulldown-cmark = "0.13"
rand = "0.10"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spin-sdk = { version = "7.0.0", default-features = false, features = ["http", "sqlite"] }
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Clipboard",
    "Location",
    "Element",
    "Document",
    "Storage",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlElement",
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "TextDecoder",
    "TextDecodeOptions",
    "FileSystemFileHandle",
    "FileSystemDirectoryHandle",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "DirectoryPickerOptions",
    "FileSystemPermissionMode",
    "FileSystemHandlePermissionDescriptor",
    "FileSystemGetDirectoryOptions",
    "FileSystemWritableFileStream",
    "File",
    "Blob",
    "Response",
    "Url",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbRequest",
    "IdbTransactionMode",
    "IdbOpenDbRequest",
] }

[profile.release]
opt-level = "s"
lto = true
