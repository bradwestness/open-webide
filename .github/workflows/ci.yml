name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-and-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt, llvm-tools
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Install browser parser C compiler
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (native crates)
        run: cargo clippy -p openwebide-core -p openwebide-llm -p openwebide-storage -p openwebide-agent -p openwebide-auth --features openwebide-core/editor-parser --all-targets -- -D warnings

      - name: Clippy (backend, wasm32-wasip2)
        run: cargo clippy -p openwebide-backend --target wasm32-wasip2 -- -D warnings

      - name: Clippy (frontend, wasm32-unknown-unknown)
        run: cargo clippy -p openwebide-frontend --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy (bridge)
        run: cargo clippy -p openwebide-bridge --all-targets -- -D warnings

      - name: Tests (native)
        run: cargo test -p openwebide-core -p openwebide-llm -p openwebide-storage -p openwebide-agent -p openwebide-auth -p openwebide-bridge -p openwebide-backend --features openwebide-core/editor-parser

      - name: Tests (frontend native)
        run: cargo test -p openwebide-frontend

      - name: Build backend component
        run: cargo build -p openwebide-backend --target wasm32-wasip2 --release

  bridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check bridge Windows adapters with TLS
        run: cargo clippy -p openwebide-bridge -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: wasm32-unknown-unknown

      - name: Install browser parser C compiler
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk

      - name: Test PWA caching and installation
        run: node --test frontend/pwa/pwa.test.cjs

      - name: Build frontend
        run: cd frontend && trunk build --release

  frontend-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: wasm32-unknown-unknown

      - name: Install browser parser C compiler
        run: sudo apt-get update && sudo apt-get install -y clang

      - uses: Swatinem/rust-cache@v2

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      # ChromeDriver otherwise launches the runner's preinstalled Chrome, whose
      # version needn't match the driver setup-chrome installed.
      - name: Point ChromeDriver at the installed Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s","args":["--window-size=1280,900"]}}\n' "$CHROME_PATH" \
            | tee webdriver.json > frontend/webdriver.json

      - name: Install wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Tests (frontend UI)
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: cargo test -p openwebide-frontend --target wasm32-unknown-unknown

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test container supervisor
        run: bash docker/entrypoint-test.sh

      - name: Build container image
        run: docker build -t open-webide:ci .

      - name: Check bundled bridge
        run: docker run --rm open-webide:ci openwebide-bridge --help

      - name: Check host-owned workspace Git access
        run: docker run --rm -v "$PWD/docker/git-ownership-test.sh:/git-ownership-test.sh:ro" open-webide:ci bash /git-ownership-test.sh

      - name: Check HTTPS REST, SSE and WebSocket transport (Docker)
        run: python3 docker/https-test/check.py docker

      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Load the same image into rootless Podman
        run: docker save open-webide:ci | podman load

      - name: Check HTTPS REST, SSE and WebSocket transport (rootless Podman)
        run: python3 docker/https-test/check.py podman --port 8447
