name: Project site

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'site/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'frontend/styles.css', 'frontend/pwa/favicon.svg', '.github/workflows/pages.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'site/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'frontend/styles.css', 'frontend/pwa/favicon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-metadata
          cache-targets: false
      - run: pip install -r site/requirements.txt
      - name: Build and validate site
        run: python site/build.py --output "$RUNNER_TEMP/project-site"
      # The Pages convenience action excludes dot directories, including .well-known.
      - name: Package site including WebFinger discovery
        run: |
          tar --dereference --hard-dereference --exclude=.open-webide-site \
            -cf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/project-site" .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx "./.well-known/webfinger"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
