name: Bug report
description: Report behavior that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small example if possible.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version or commit
      description: For containers, include the image tag.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workspace mode
      options: [Remote, Local, Both, No project]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, Docker/Podman/source install, model server and model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, prompts and private source code before sharing.
