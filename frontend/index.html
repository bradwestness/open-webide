<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open WebIDE</title>
    <script>
      // Apply the cached theme before first paint to avoid a flash. "system"
      // (the default) follows the OS light/dark preference.
      (function () {
        try {
          var t = localStorage.getItem("owide-theme");
          if (t !== "light" && t !== "dark") t = "system";
          if (t === "system") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body>
    <link data-trunk rel="rust" href="." data-wasm-opt="z" />
  </body>
</html>
