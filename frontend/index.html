<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1e1f24" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/pwa.js" defer></script>
    <title>Open WebIDE</title>
    <script>
      document.documentElement.setAttribute("data-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <script src="/api/theme.js"></script>
    <link data-trunk rel="copy-dir" href="fonts" />
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body>
    <link data-trunk rel="rust" href="." />
  </body>
