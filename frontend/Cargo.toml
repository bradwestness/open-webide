[package]
name = "openwebide-frontend"
description = "Open WebIDE Leptos frontend (WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64 = { workspace = true }
ammonia = "4.2.0"
futures = { workspace = true }
gloo-net = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
openwebide-agent = { workspace = true }
openwebide-core = { workspace = true }
openwebide-llm = { workspace = true }
pulldown-cmark = { workspace = true }
send_wrapper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["RequestCredentials", "MutationObserver", "MutationObserverInit", "Notification", "NotificationPermission", "NotificationOptions"] }

[features]
test-support = []

[dev-dependencies]
openwebide-core = { workspace = true, features = ["test-support"] }
wasm-bindgen-test = "0.3.78"
openwebide-frontend = { path = ".", features = ["test-support"] }

[lints]
workspace = true
