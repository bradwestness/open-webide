[package]
name = "openwebide-editor-bench"
description = "Native and browser measurements for shared editor primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
openwebide-core = { workspace = true }
crop = { version = "=0.4.3", features = ["utf16-metric", "graphemes"], optional = true }
ropey = { version = "=1.6.1", default-features = false, features = ["simd"], optional = true }

[features]
candidates = ["dep:crop", "dep:ropey"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[lints]
workspace = true
