#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "open-webide"
version = "0.1.0"
authors = ["Brad Westness"]
description = "WebAssembly-based IDE for local-LLM coding agents"

[[trigger.http]]
route = "/api/..."
component = "backend"

[[trigger.http]]
route = "/..."
component = "frontend"

[component.backend]
source = "target/wasm32-wasip2/release/openwebide_backend.wasm"
sqlite_databases = ["default"]
allowed_outbound_hosts = [
    # Localhost — engines running on the machine running Spin.
    "*://localhost:*",
    "*://127.0.0.1:*",
    # Tailscale MagicDNS — engines on a tailnet.
    "*://*.ts.net:*",
    # Cloudflare Quick Tunnel — no-account tunnels.
    "*://*.trycloudflare.com:*",
    # ngrok — free tier.
    "*://*.ngrok-free.app:*",
    # NetBird — WireGuard mesh (Tailscale-style).
    "*://*.netbird.cloud:*",
    # Nord — NordLynx.
    "*://*.nord:*",
    # Cloudflare Mesh.
    "*://*.cloudflaremesh.com:*",
    # Outbound web search and documentation fetching
    "https://*:*",
    "http://*:*",
]
# Remote-mode workspace: the user's `~/source` directory, preopened into the
# component. Spin copies `source` into a temp dir and preopens it at `/`.
# Project `path` values are relative to `~/source`, so a project working in
# `~/source/repos/myproject` uses `path = "repos/myproject"`.
# To change the mounted root, edit `source` below (relative to this file).
files = [{ source = "../..", destination = "/" }]

[component.backend.build]
command = "cargo build -p openwebide-backend --target wasm32-wasip2 --release"
watch = ["backend/src/**/*.rs", "crates/**/*.rs", "Cargo.toml"]

[component.frontend]
source = { url = "https://github.com/spinframework/spin-fileserver/releases/download/v0.3.0/spin_static_fs.wasm", digest = "sha256:ef88708817e107bf49985c7cefe4dd1f199bf26f6727819183d5c996baa3d148" }
files = [{ source = "frontend/dist", destination = "/" }]

[component.frontend.build]
command = "cd frontend && trunk build --release"
